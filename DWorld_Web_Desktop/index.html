<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050108">
  <title>D-World Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="D-World desktop game"></canvas>

  <section id="menu" class="screen">
    <div class="brand">
      <span class="kicker">desktop arena edition</span>
      <h1>D-WORLD</h1>
      <p>Ricochet combat, reactive neon arenas, smarter enemy pressure, and a giant boss training mode.</p>
    </div>
    <div class="actions">
      <button id="playCampaign" class="primary">Play Campaign</button>
      <button id="playTraining">Boss Training</button>
      <button id="fullScreenBtn">Full Screen</button>
      <button id="musicBtn">Music: On</button>
    </div>
    <div class="stats">
      <span>Best room <b id="bestRoom">1</b></span>
      <span>WASD move</span>
      <span>Mouse aim and shoot</span>
      <span>Shift dash</span>
      <span>Space ultimate</span>
    </div>
  </section>

  <section id="pause" class="screen compact hidden">
    <h2>Paused</h2>
    <button id="resumeBtn" class="primary">Resume</button>
    <button id="pauseMenuBtn">Main Menu</button>
  </section>

  <section id="gameOver" class="screen compact hidden">
    <h2>You Are Dead</h2>
    <p id="runSummary">Room 1</p>
    <button id="retryBtn" class="primary">Retry</button>
    <button id="deathMenuBtn">Main Menu</button>
  </section>

  <div id="hud" class="hud hidden">
    <div class="hud-left">
      <span id="hpText">HP 3</span>
      <span id="ammoText">AMMO 60</span>
      <span id="roomText">ROOM 1</span>
    </div>
    <button id="pauseBtn">II</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
