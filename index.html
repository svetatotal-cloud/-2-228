<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050108">
  <title>D-World</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: #050108;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 34, 48, .26), transparent 28%),
        radial-gradient(circle at 18% 82%, rgba(0, 225, 255, .14), transparent 32%),
        linear-gradient(180deg, #09030d, #020106);
    }
    main {
      width: min(980px, 100%);
    }
    span {
      display: block;
      color: #66f4ff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 4px 0 12px;
      color: #ff252e;
      font-size: clamp(78px, 16vw, 190px);
      line-height: .82;
      text-shadow: 0 0 22px rgba(255, 0, 34, .72), 0 0 86px rgba(255, 0, 34, .36);
    }
    p {
      max-width: 720px;
      margin: 0 0 24px;
      color: rgba(255,255,255,.76);
      font-size: clamp(17px, 2.3vw, 25px);
      line-height: 1.35;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 620px;
    }
    a {
      min-height: 64px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      color: #fff;
      text-decoration: none;
      font-weight: 950;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 14px 38px rgba(0,0,0,.34);
    }
    a.primary {
      border-color: rgba(255, 61, 68, .85);
      background: linear-gradient(180deg, rgba(255, 50, 58, .92), rgba(120, 3, 14, .94));
    }
    @media (max-width: 640px) {
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <span>choose your arena</span>
    <h1>D-WORLD</h1>
    <p>Play the neon arena shooter in your browser. Phone players should use the mobile version with touch sticks and ability buttons.</p>
    <div class="actions">
      <a class="primary" href="DWorld_Web_Mobile/">Play Mobile</a>
      <a href="DWorld_Web_Desktop/">Play Desktop</a>
    </div>
  </main>
  <script>
    const mobile = matchMedia("(pointer: coarse)").matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (mobile && !location.hash) {
      document.querySelector(".primary").focus();
    }
  </script>
</body>
</html>
